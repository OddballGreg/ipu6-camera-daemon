[package]
name = "ipu6-camera-daemon"
version = "0.1.0"
edition = "2021"
description = "On-demand camera daemon for Intel IPU6 cameras"
license = "MIT"

[dependencies]
anyhow = "1.0"
log = "0.4"
env_logger = "0.11"
clap = { version = "4", features = ["derive"] }
ctrlc = "3.4"
inotify = "0.11"
libc = "0.2.182"

[profile.release]
lto = true
strip = true
